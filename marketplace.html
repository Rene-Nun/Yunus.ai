<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yunus — Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0a0a;
  --paper: #F2EFE8;
  --volt: #D4F53C;
  --muted: #5C5C5C;
  --border: rgba(242,239,232,0.1);
  --card-bg: #111111;
  --red: #ef4444;
}

- { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: var(–volt); color: var(–ink); }

html, body {
min-height: 100dvh;
background: var(–ink);
color: var(–paper);
font-family: ‘DM Sans’, sans-serif;
font-weight: 300;
overflow-x: hidden;
}

body::after {
content: ‘’;
position: fixed; inset: 0;
pointer-events: none; z-index: 9999; opacity: 0.03;
background-image: url(“data:image/svg+xml,%3Csvg viewBox=‘0 0 256 256’ xmlns=‘http://www.w3.org/2000/svg’%3E%3Cfilter id=‘noise’%3E%3CfeTurbulence type=‘fractalNoise’ baseFrequency=‘0.9’ numOctaves=‘4’ stitchTiles=‘stitch’/%3E%3C/filter%3E%3Crect width=‘100%25’ height=‘100%25’ filter=‘url(%23noise)’/%3E%3C/svg%3E”);
background-size: 128px;
}

/* ═══════════════════════════
ACCESS LAYER
═══════════════════════════ */
#accessLayer {
position: fixed; inset: 0; z-index: 500;
background: var(–ink);
display: flex; flex-direction: column;
}
#accessLayer.hidden { display: none; }

.access-screen {
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
flex: 1;
padding: 32px 24px;
overflow-y: auto;
}
.access-screen.active { display: flex; }

/* Código screen */
.codigo-inner {
position: relative; z-index: 1;
width: 100%; max-width: 360px;
display: flex; flex-direction: column; align-items: center;
}
.codigo-logo {
width: 110px; height: 110px; object-fit: contain;
margin-bottom: 40px;
opacity: 0; animation: fadeUp 0.6s ease 0.1s both;
}
.codigo-label {
font-family: ‘DM Mono’, monospace;
font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
color: var(–muted); margin-bottom: 16px; text-align: center;
opacity: 0; animation: fadeUp 0.5s ease 0.2s both;
}
#codigoInput {
width: 100%;
background: transparent; border: none;
border-bottom: 1px solid rgba(242,239,232,0.2);
padding: 16px 0;
font-family: ‘DM Mono’, monospace;
font-size: 22px; letter-spacing: 0.25em; text-transform: uppercase;
text-align: center; color: var(–paper); outline: none;
transition: border-color 0.3s;
opacity: 0; animation: fadeUp 0.5s ease 0.3s both;
}
#codigoInput::placeholder { color: rgba(242,239,232,0.15); }
#codigoInput:focus { border-color: var(–volt); }
#codigoError {
display: none;
font-family: ‘DM Mono’, monospace;
font-size: 10px; letter-spacing: 0.1em;
color: var(–red); margin-top: 12px; text-align: center;
}
#btnEntrarCodigo {
width: 100%; margin-top: 32px;
background: var(–volt); color: var(–ink);
font-family: ‘DM Mono’, monospace;
font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
border: none; padding: 16px; cursor: pointer;
font-weight: 500; transition: opacity 0.2s;
opacity: 0; animation: fadeUp 0.5s ease 0.4s both;
}
#btnEntrarCodigo:hover { opacity: 0.85; }
#btnEntrarCodigo:disabled { opacity: 0.4; cursor: not-allowed; }
.ya-tengo-link {
margin-top: 28px;
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 0.14em; text-transform: uppercase;
color: var(–muted); cursor: pointer; text-align: center;
transition: color 0.2s;
opacity: 0; animation: fadeUp 0.5s ease 0.5s both;
}
.ya-tengo-link:hover { color: var(–paper); }

/* Login screen */
.login-inner {
width: 100%; max-width: 360px;
display: flex; flex-direction: column; align-items: center;
}
.back-btn {
align-self: flex-start; margin-bottom: 32px;
background: none; border: none; cursor: pointer;
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 0.12em; text-transform: uppercase;
color: var(–muted); display: flex; align-items: center; gap: 8px;
transition: color 0.2s;
}
.back-btn:hover { color: var(–paper); }
.access-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 40px; color: var(–paper);
letter-spacing: 0.04em; margin-bottom: 8px; text-align: center;
line-height: 1;
}
.access-sub {
font-size: 13px; color: var(–muted); text-align: center;
line-height: 1.65; margin-bottom: 32px;
}
.input-row-acc { display: flex; gap: 0; width: 100%; margin-bottom: 12px; }
.prefix-acc {
padding: 14px 12px;
background: rgba(255,255,255,0.04);
border: 1px solid var(–border); border-right: none;
font-family: ‘DM Mono’, monospace; font-size: 13px;
color: var(–muted); flex-shrink: 0;
}
.input-acc {
flex: 1; padding: 14px;
background: rgba(255,255,255,0.04);
border: 1px solid var(–border);
font-size: 16px; color: var(–paper);
font-family: inherit; outline: none;
transition: border-color 0.2s; -webkit-appearance: none;
}
.input-acc:focus { border-color: var(–volt); }
.input-acc::placeholder { color: var(–muted); }
.btn-acc-primary {
width: 100%; background: var(–volt); color: var(–ink);
font-family: ‘DM Mono’, monospace; font-size: 11px;
letter-spacing: 0.1em; text-transform: uppercase;
border: none; padding: 16px; cursor: pointer;
font-weight: 500; transition: opacity 0.2s; margin-top: 4px;
}
.btn-acc-primary:hover { opacity: 0.85; }
.btn-acc-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.acc-error {
display: none; margin-top: 10px; padding: 10px 14px;
background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 0.08em; color: var(–red); text-align: center; width: 100%;
}

/* Registro screen */
#screenRegistro {
display: none; flex-direction: column;
align-items: stretch; justify-content: flex-start;
flex: 1; overflow-y: auto; padding: 0;
}
#screenRegistro.active { display: flex; }
.reg-header {
padding: 20px 24px; border-bottom: 1px solid var(–border);
display: flex; align-items: center; justify-content: space-between;
background: rgba(10,10,10,0.95); backdrop-filter: blur(12px);
flex-shrink: 0; position: sticky; top: 0; z-index: 10;
}
.reg-header img { height: 36px; object-fit: contain; }
.reg-step-label {
font-family: ‘DM Mono’, monospace; font-size: 9px;
letter-spacing: 0.16em; text-transform: uppercase; color: var(–muted);
}
.reg-body { flex: 1; overflow-y: auto; padding: 32px 24px 100px; }
.reg-body::-webkit-scrollbar { display: none; }
.reg-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 40px; color: var(–paper);
letter-spacing: 0.04em; margin-bottom: 6px; line-height: 1;
}
.reg-sub {
font-size: 13px; color: var(–muted); line-height: 1.6;
margin-bottom: 28px;
}
.form-group { margin-bottom: 16px; }
.form-label {
display: block; font-family: ‘DM Mono’, monospace;
font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
color: var(–muted); margin-bottom: 8px;
}
.form-input {
width: 100%; padding: 14px 16px;
background: rgba(255,255,255,0.04);
border: 1px solid var(–border);
color: var(–paper); font-family: ‘DM Sans’, sans-serif;
font-size: 15px; outline: none;
transition: border-color 0.2s; -webkit-appearance: none;
}
.form-input:focus { border-color: var(–volt); }
.form-input::placeholder { color: var(–muted); }
.prefix-wrap { display: flex; }
.prefix-tag {
padding: 14px 12px;
background: rgba(255,255,255,0.04);
border: 1px solid var(–border); border-right: none;
font-family: ‘DM Mono’, monospace; font-size: 13px; color: var(–muted);
}
.prefix-wrap .form-input { border-left: none; }
.terms-wrap {
display: flex; align-items: flex-start; gap: 12px;
background: rgba(255,255,255,0.03);
border: 1px solid var(–border); padding: 14px; margin-top: 8px;
}
.terms-wrap input[type=checkbox] {
width: 16px; height: 16px; margin-top: 2px;
flex-shrink: 0; accent-color: var(–volt);
}
.terms-wrap label { font-size: 12px; color: var(–muted); line-height: 1.6; cursor: pointer; }
.terms-wrap label span { color: var(–paper); text-decoration: underline; cursor: pointer; }
#regError {
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 0.08em; color: var(–red);
margin-top: 10px; display: none;
}
.reg-footer {
padding: 14px 24px; background: rgba(10,10,10,0.95);
border-top: 1px solid var(–border);
backdrop-filter: blur(12px); flex-shrink: 0;
position: sticky; bottom: 0;
}

/* Bienvenida screen */
#screenBienvenida { text-align: center; }
.bienvenida-inner {
width: 100%; max-width: 320px;
display: flex; flex-direction: column; align-items: center;
}
.check-icon {
width: 60px; height: 60px; background: var(–volt);
display: flex; align-items: center; justify-content: center;
margin-bottom: 20px;
}
.bienvenida-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 48px; color: var(–paper);
letter-spacing: 0.04em; line-height: 0.95; margin-bottom: 10px;
}
.bienvenida-sub { font-size: 13px; color: var(–muted); line-height: 1.7; margin-bottom: 32px; }
.btn-ir {
width: 100%; background: var(–volt); color: var(–ink);
font-family: ‘DM Mono’, monospace; font-size: 11px;
letter-spacing: 0.12em; text-transform: uppercase;
border: none; padding: 16px; cursor: pointer;
font-weight: 500; transition: opacity 0.2s;
}
.btn-ir:hover { opacity: 0.85; }

/* ═══════════════════════════
MAIN APP
═══════════════════════════ */
#mainApp { display: none; }
#mainApp.visible { display: block; }

/* HEADER */
header {
position: sticky; top: 0; z-index: 100;
background: rgba(10,10,10,0.92);
backdrop-filter: blur(16px);
border-bottom: 1px solid var(–border);
}
.header-inner {
max-width: 480px; margin: 0 auto;
padding: 0 20px; height: 60px;
display: flex; align-items: center; justify-content: space-between;
}
.header-logo { height: 110px; display: block; }
.btn-ceder {
display: flex; align-items: center; gap: 6px;
background: transparent;
border: 1px solid var(–border);
color: var(–muted);
font-family: ‘DM Mono’, monospace; font-size: 9px;
letter-spacing: 0.12em; text-transform: uppercase;
padding: 8px 12px; cursor: pointer;
transition: all 0.2s;
}
.btn-ceder:hover { border-color: var(–volt); color: var(–volt); }

/* INTRO STRIP */
.intro-strip {
max-width: 480px; margin: 0 auto;
padding: 20px 20px 0;
}
.intro-label {
font-family: ‘DM Mono’, monospace;
font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
color: var(–muted);
display: flex; align-items: center; gap: 12px; margin-bottom: 0;
}
.intro-label::after { content: ‘’; flex: 1; height: 1px; background: var(–border); }

/* EVENTS GRID */
main { max-width: 480px; margin: 0 auto; }
.boletos-grid { padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 20px; }

/* EVENT CARD */
.evento-card {
background: var(–card-bg);
border: 1px solid var(–border);
overflow: hidden;
transition: border-color 0.25s, transform 0.25s;
}
.evento-card:hover { border-color: rgba(212,245,60,0.3); transform: translateY(-2px); }

.evento-img-wrap { position: relative; width: 100%; height: 168px; overflow: hidden; }
.evento-img {
width: 100%; height: 100%; object-fit: cover; display: block;
filter: brightness(0.6) saturate(0.85);
transition: filter 0.3s;
}
.evento-card:hover .evento-img { filter: brightness(0.75) saturate(1); }

.evento-badge {
position: absolute; top: 12px; left: 12px;
font-family: ‘DM Mono’, monospace; font-size: 8px;
letter-spacing: 0.14em; text-transform: uppercase;
padding: 4px 10px; background: var(–volt); color: var(–ink);
font-weight: 500;
}
.evento-precio-badge {
position: absolute; bottom: 12px; right: 12px;
font-family: ‘Bebas Neue’, sans-serif; font-size: 22px;
letter-spacing: 0.04em; color: var(–volt);
background: rgba(10,10,10,0.82); padding: 5px 12px;
backdrop-filter: blur(8px);
}

/* Indicador de boletos disponibles */
.disponibles-dot {
position: absolute; top: 12px; right: 12px;
display: flex; align-items: center; gap: 6px;
background: rgba(10,10,10,0.75); backdrop-filter: blur(8px);
padding: 5px 10px;
}
.dot-pulse {
width: 6px; height: 6px; border-radius: 50%;
background: var(–volt);
animation: dotPulse 2s infinite;
}
.dot-pulse.amber { background: #f59e0b; animation: dotPulse 2s infinite; }
@keyframes dotPulse {
0%, 100% { opacity: 1; transform: scale(1); }
50% { opacity: 0.5; transform: scale(0.85); }
}
.disponibles-label {
font-family: ‘DM Mono’, monospace; font-size: 8px;
letter-spacing: 0.1em; text-transform: uppercase; color: var(–paper);
}

.evento-body { padding: 18px 20px 20px; }
.evento-nombre {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 30px; letter-spacing: 0.04em; color: var(–paper);
line-height: 1; margin-bottom: 6px;
}
.evento-meta {
display: flex; align-items: center; gap: 10px;
margin-bottom: 16px;
}
.evento-tag {
font-family: ‘DM Mono’, monospace; font-size: 9px;
letter-spacing: 0.1em; text-transform: uppercase; color: var(–muted);
}
.evento-fecha {
font-family: ‘DM Mono’, monospace; font-size: 9px;
letter-spacing: 0.08em; color: var(–muted);
}
.evento-fecha::before { content: ‘·’; margin-right: 10px; opacity: 0.4; }

.evento-desc {
font-size: 12px; color: var(–muted); line-height: 1.65;
margin-bottom: 16px;
}

/* Botones de acción duales */
.evento-actions { display: flex; flex-direction: column; gap: 8px; }
.btn-ver-boletos {
width: 100%; padding: 14px;
background: var(–volt); color: var(–ink);
font-family: ‘DM Mono’, monospace; font-size: 11px;
letter-spacing: 0.1em; text-transform: uppercase;
border: none; cursor: pointer; font-weight: 500;
transition: opacity 0.2s;
display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-ver-boletos:hover { opacity: 0.85; }
.btn-listar {
width: 100%; padding: 11px;
background: transparent; color: var(–muted);
font-family: ‘DM Mono’, monospace; font-size: 9px;
letter-spacing: 0.1em; text-transform: uppercase;
border: 1px solid rgba(242,239,232,0.08); cursor: pointer;
transition: all 0.2s;
display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-listar:hover { border-color: rgba(212,245,60,0.3); color: var(–volt); }

/* Perforación decorativa */
.card-perf {
display: flex; align-items: center;
padding: 0 18px; position: relative; margin: 0 -1px;
}
.card-perf::before {
content: ‘’; position: absolute; left: -7px;
width: 14px; height: 14px; border-radius: 50%;
background: var(–ink); border: 1px solid var(–border); z-index: 1;
}
.card-perf::after {
content: ‘’; position: absolute; right: -7px;
width: 14px; height: 14px; border-radius: 50%;
background: var(–ink); border: 1px solid var(–border); z-index: 1;
}
.perf-line {
flex: 1; height: 1px;
background: repeating-linear-gradient(90deg, var(–border) 0, var(–border) 5px, transparent 5px, transparent 10px);
}
.perf-label {
font-family: ‘DM Mono’, monospace; font-size: 8px;
letter-spacing: 0.16em; text-transform: uppercase; color: var(–muted);
padding: 8px 10px; flex-shrink: 0;
}

/* ═══════════════════════════
PANEL FLOTANTE — BOLETOS
═══════════════════════════ */
.panel-bg {
position: fixed; inset: 0;
background: rgba(0,0,0,0.75);
backdrop-filter: blur(8px);
z-index: 400;
display: none; align-items: flex-end; justify-content: center;
}
.panel-bg.open { display: flex; }

.panel-sheet {
width: 100%; max-width: 480px;
background: #0f0f0f;
border-top: 1px solid var(–border);
border-radius: 16px 16px 0 0;
max-height: 90dvh;
display: flex; flex-direction: column;
transform: translateY(100%);
transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
.panel-bg.open .panel-sheet { transform: translateY(0); }

.panel-handle {
display: flex; justify-content: center; padding: 12px 0 4px;
flex-shrink: 0;
}
.panel-handle-bar {
width: 36px; height: 4px; border-radius: 2px;
background: rgba(242,239,232,0.15);
}

.panel-header {
padding: 4px 20px 16px;
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}
.panel-evento-nombre {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 28px; letter-spacing: 0.04em; color: var(–paper);
line-height: 1; margin-bottom: 4px;
}
.panel-evento-meta {
font-family: ‘DM Mono’, monospace; font-size: 9px;
letter-spacing: 0.1em; text-transform: uppercase; color: var(–muted);
}
.panel-close {
position: absolute; top: 16px; right: 20px;
background: none; border: none; cursor: pointer;
color: var(–muted); font-size: 22px; line-height: 1; padding: 4px;
transition: color 0.2s;
}
.panel-close:hover { color: var(–paper); }

.panel-body {
flex: 1; overflow-y: auto; padding: 16px 20px 32px;
}
.panel-body::-webkit-scrollbar { display: none; }

.panel-section-label {
font-family: ‘DM Mono’, monospace;
font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
color: var(–muted); margin-bottom: 12px;
display: flex; align-items: center; gap: 10px;
}
.panel-section-label::after { content: ‘’; flex: 1; height: 1px; background: var(–border); }

/* Mapa del recinto placeholder */
.recinto-map {
width: 100%; height: 180px;
background: #161616;
border: 1px solid var(–border);
display: flex; align-items: center; justify-content: center;
margin-bottom: 20px; position: relative; overflow: hidden;
}
.recinto-map img {
width: 100%; height: 100%; object-fit: contain;
}
.recinto-map-placeholder {
display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.recinto-map-placeholder span {
font-family: ‘DM Mono’, monospace; font-size: 9px;
letter-spacing: 0.14em; text-transform: uppercase; color: var(–muted);
}

/* Boletos en panel */
.boleto-item {
background: var(–card-bg);
border: 1px solid var(–border);
padding: 16px 18px;
margin-bottom: 10px;
display: flex; align-items: center; justify-content: space-between;
gap: 12px;
transition: border-color 0.2s;
cursor: pointer;
}
.boleto-item:hover { border-color: rgba(212,245,60,0.35); }
.boleto-item-info { flex: 1; }
.boleto-item-zona {
font-family: ‘DM Mono’, monospace; font-size: 10px;
letter-spacing: 0.1em; text-transform: uppercase; color: var(–paper);
margin-bottom: 4px;
}
.boleto-item-detalle {
font-size: 12px; color: var(–muted); line-height: 1.5;
}
.boleto-item-precio {
font-family: ‘Bebas Neue’, sans-serif; font-size: 22px;
letter-spacing: 0.04em; color: var(–volt); text-align: right; flex-shrink: 0;
}
.boleto-item-sub {
font-family: ‘DM Mono’, monospace; font-size: 8px;
letter-spacing: 0.08em; text-transform: uppercase;
color: var(–muted); text-align: right;
}

.panel-empty {
padding: 40px 0; text-align: center;
}
.panel-empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.35; }
.panel-empty-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 24px; color: var(–paper); letter-spacing: 0.04em; margin-bottom: 6px;
}
.panel-empty-sub { font-size: 12px; color: var(–muted); line-height: 1.65; }

.panel-loading {
display: flex; flex-direction: column; align-items: center;
padding: 40px 0; gap: 14px;
}
.spinner-sm {
width: 22px; height: 22px; border-radius: 50%;
border: 2px solid var(–border); border-top-color: var(–volt);
animation: spin 0.8s linear infinite;
}

/* ═══════════════════════════
MODAL LEGAL
═══════════════════════════ */
.modal-bg {
position: fixed; inset: 0; background: rgba(0,0,0,0.75);
backdrop-filter: blur(8px); z-index: 600; display: none;
align-items: center; justify-content: center; padding: 24px;
}
.modal-bg.open { display: flex; }
.modal-panel {
background: #111; border: 1px solid var(–border);
width: 100%; max-width: 480px; max-height: 88vh;
overflow-y: auto; position: relative; border-radius: 4px;
}
.modal-panel::-webkit-scrollbar { width: 3px; }
.modal-panel::-webkit-scrollbar-thumb { background: var(–border); }
.modal-header {
padding: 20px 24px; border-bottom: 1px solid var(–border);
display: flex; align-items: center; justify-content: space-between;
position: sticky; top: 0; background: #111; z-index: 1;
}
.modal-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 22px; color: var(–paper); letter-spacing: 0.04em;
}
.modal-close {
background: none; border: none; cursor: pointer;
color: var(–muted); font-size: 20px; line-height: 1; padding: 4px;
transition: color 0.2s;
}
.modal-close:hover { color: var(–paper); }
.modal-footer {
padding: 14px 24px; border-top: 1px solid var(–border);
position: sticky; bottom: 0; background: #111;
}
.legal-content {
padding: 24px; font-size: 12px; color: var(–muted); line-height: 1.75;
}
.legal-content h2 {

function mostrarCodigoError(msg) {
  const el = document.getElementById('codigoError');
  el.textContent = msg; el.style.display = 'block';
}
function ocultarCodigoError() {
  document.getElementById('codigoError').style.display = 'none';
}

async function validarCodigo() {
  const codigo = document.getElementById('codigoInput').value.trim();
  if (!codigo) { mostrarCodigoError('Ingresa tu código de acceso.'); return; }
  ocultarCodigoError();
  const btn = document.getElementById('btnEntrarCodigo');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border:2px solid #0a0a0a;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;"></span>Verificando...';
  try {
    const res = await fetch('/api/validar-codigo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo })
    });
    const data = await res.json();
    if (!res.ok) {
      mostrarCodigoError(data.error || 'Código no válido.');
      btn.disabled = false; btn.textContent = 'Entrar →'; return;
    }
    celularDesdeWaitlist = data.celular || '';
    if (celularDesdeWaitlist) {
      document.getElementById('r_celular').value = celularDesdeWaitlist.replace('+52', '');
    }
    btn.disabled = false; btn.textContent = 'Entrar →';
    showScreen('screenRegistro');
  } catch {
    mostrarCodigoError('Error de conexión. Intenta de nuevo.');
    btn.disabled = false; btn.textContent = 'Entrar →';
  }
}

document.getElementById('codigoInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') validarCodigo();
});

/* ════════════════════════════════════════
   ACCESO — LOGIN
════════════════════════════════════════ */
async function iniciarSesion() {
  const input = document.getElementById('celularLoginInput').value.trim();
  const errEl = document.getElementById('loginError');
  if (input.length !== 10) {
    errEl.textContent = 'Ingresa 10 dígitos válidos.';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';
  const btn = document.querySelector('#screenLogin .btn-acc-primary');
  btn.disabled = true; btn.textContent = 'Verificando...';
  const numero = '+52' + input;
  try {
    const res = await fetch('/api/historial?celular=' + encodeURIComponent(numero));
    if (res.status === 404) {
      errEl.textContent = 'Número no registrado. Solicita tu código de acceso.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar →'; return;
    }
    localStorage.setItem('yunus_celular', numero);
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('yunus_historial', JSON.stringify(data.historial || []));
    }
    btn.disabled = false; btn.textContent = 'Entrar →';
    entrarApp();
  } catch {
    // Fallo de red: igual dejamos pasar con lo del localStorage
    localStorage.setItem('yunus_celular', numero);
    btn.disabled = false; btn.textContent = 'Entrar →';
    entrarApp();
  }
}

document.getElementById('celularLoginInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') iniciarSesion();
});

/* ════════════════════════════════════════
   ACCESO — REGISTRO
   Envía campos esenciales + defaults para
   campos eliminados → no rompe /api/registrar
════════════════════════════════════════ */
async function submitRegistro() {
  const nombre = document.getElementById('r_nombre').value.trim();
  const celRaw = document.getElementById('r_celular').value.trim();
  const edad   = document.getElementById('r_edad').value.trim();
  const terms  = document.getElementById('r_terms').checked;
  const errEl  = document.getElementById('regError');

  if (!nombre || celRaw.length !== 10 || !edad || parseInt(edad) < 18) {
    errEl.textContent = 'Completa todos los campos. Debes ser mayor de 18 años.';
    errEl.style.display = 'block'; return;
  }
  if (!terms) {
    errEl.textContent = 'Debes aceptar los términos para continuar.';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';

  const btn = document.querySelector('#screenRegistro .btn-acc-primary');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border:2px solid #0a0a0a;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;"></span>Creando cuenta...';

  // Payload: campos reales + defaults seguros para campos eliminados
  const payload = {
    celular:              '+52' + celRaw,
    Nombre_completo:      nombre,
    Edad:                 edad,
    // Defaults para campos eliminados del formulario (no rompen la BD)
    Entidad_federativa:   '',
    Codigo_postal:        '',
    Ingreso_mensual:      '',
    Marca_celular:        '',
    Gastos_celular:       '',
    Gastos_vivienda:      '',
    Gastos_automovil:     '',
    Dependientes:         '',
    Historial_crediticio: '',
    Otras_deudas:         ''
  };

  try {
    const res = await fetch('/api/registrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Error al crear la cuenta.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Crear cuenta →'; return;
    }
    localStorage.setItem('yunus_celular', '+52' + celRaw);
    localStorage.setItem('yunus_historial', JSON.stringify([]));
    btn.disabled = false; btn.textContent = 'Crear cuenta →';
    showScreen('screenBienvenida');
  } catch {
    errEl.textContent = 'Error de conexión. Intenta de nuevo.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Crear cuenta →';
  }
}

      <div class="evento-actions">
        <button class="btn-ver-boletos" onclick="abrirPanel('${ev.id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
          Ver boletos disponibles
        </button>
        <button class="btn-listar" onclick="listarParaEvento('${ev.id}', '${ev.name.replace(/'/g,"\\'")}')">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Lista boletos para este evento
        </button>
      </div>
    </div>
    <div class="card-perf">
      <div class="perf-line"></div>
      <span class="perf-label">Marketplace Yunus</span>
      <div class="perf-line"></div>
    </div>
  </div>`;
}

/* ════════════════════════════════════════
   PANEL DE BOLETOS
════════════════════════════════════════ */
async function abrirPanel(eventoId) {
  const ev = EVENTOS.find(e => e.id === eventoId);
  if (!ev) return;
  panelEventoActual = ev;

  document.getElementById('panelNombre').textContent = ev.name;
  document.getElementById('panelMeta').textContent = ev.tag + ' · ' + ev.fecha;

  // Mostrar panel con loading
  const panelBg = document.getElementById('boletosPanel');
  const panelBody = document.getElementById('panelBody');
  panelBg.classList.add('open');
  document.body.style.overflow = 'hidden';

  panelBody.innerHTML = `
    <div class="panel-loading">
      <div class="spinner-sm"></div>
      <span style="font-family:'DM Mono',monospace;font-size:9px;
        letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);">
        Cargando boletos...
      </span>
    </div>`;

  // Cargar boletos del marketplace
  try {
    const res = await fetch('/api/marketplace');
    const data = await res.json();
    const todos = data.boletos || [];
    // Filtrar por evento (match flexible)
    const filtrados = todos.filter(b =>
      b.evento && b.evento.toLowerCase().includes(ev.apiKey.toLowerCase().split(' ')[0])
    );
    boletosCache = filtrados;
    renderPanelBody(ev, filtrados);
  } catch {
    renderPanelBody(ev, []);
  }
}

function renderPanelBody(ev, boletos) {
  const panelBody = document.getElementById('panelBody');
  let html = '';

  // Mapa del recinto
  html += `
    <div class="panel-section-label" style="margin-top:4px;">Recinto</div>
    <div class="recinto-map">
      ${ev.mapaImg
        ? `<img src="${ev.mapaImg}" alt="Mapa ${ev.name}">`
        : `<div class="recinto-map-placeholder">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
              stroke="rgba(242,239,232,0.15)" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="9" y1="3" x2="9" y2="21"/>
              <line x1="15" y1="3" x2="15" y2="21"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="3" y1="15" x2="21" y2="15"/>
            </svg>
            <span>Mapa próximamente</span>
           </div>`
      }
    </div>`;

  // Boletos disponibles
  html += `<div class="panel-section-label">
    Boletos disponibles
    <span style="font-family:'DM Mono',monospace;font-size:9px;
      padding:2px 8px;background:rgba(212,245,60,0.08);
      color:var(--volt);border:1px solid rgba(212,245,60,0.2);">
      ${boletos.length}
    </span>
  </div>`;

  if (boletos.length === 0) {
    html += `
      <div class="panel-empty">
        <div class="panel-empty-icon">🎟</div>
        <div class="panel-empty-title">Sin boletos aún</div>
        <p class="panel-empty-sub">
          No hay boletos listados para este evento todavía.<br>
          ¿Tienes uno? Ponlo a trabajar.
        </p>
        <button onclick="listarParaEvento('${ev.id}', '${ev.name.replace(/'/g,"\\'")}');cerrarPanel();"
          style="margin-top:16px;padding:12px 20px;background:transparent;
            color:var(--volt);font-family:'DM Mono',monospace;font-size:10px;
            letter-spacing:0.1em;text-transform:uppercase;
            border:1px solid rgba(212,245,60,0.3);cursor:pointer;">
          Listar mi boleto →
        </button>
      </div>`;
  } else {
    html += boletos.map(b => buildBoletoItem(b)).join('');
  }

  document.getElementById('panelBody').innerHTML = html;
}

function buildBoletoItem(b) {
  const precio = b.precioReventa
    ? '$' + Number(b.precioReventa).toLocaleString('es-MX', {maximumFractionDigits:0}) + ' MXN'
    : '—';
  return `
  <div class="boleto-item" onclick="seleccionarBoleto('${b.id || ''}')">
    <div class="boleto-item-info">
      <div class="boleto-item-zona">${b.zona || 'Zona general'}</div>
      <div class="boleto-item-detalle">
        ${b.fechaEvento ? formatFecha(b.fechaEvento) : ''}
        ${b.notas ? ' · ' + b.notas : ''}
      </div>
    </div>
    <div>
      <div class="boleto-item-precio">${precio}</div>
      <div class="boleto-item-sub">precio total</div>
    </div>
  </div>`;
}

function seleccionarBoleto(id) {
  // Placeholder: aquí irá el flujo de checkout con plan de pagos
  // Por ahora redirige a chat con contexto
  const ev = panelEventoActual;
  const msg = encodeURIComponent(`Quiero comprar un boleto para ${ev ? ev.name : 'el evento'}`);
  window.location.href = `/chat?modo=chat&msg=${msg}`;
}

function cerrarPanel() {
  const panelBg = document.getElementById('boletosPanel');
  panelBg.classList.remove('open');
  document.body.style.overflow = '';
  panelEventoActual = null;
}

/* ════════════════════════════════════════
   CEDENTE
════════════════════════════════════════ */
function irACeder() {
  // Redirige a la página de cedente (pendiente de construir)
  window.location.href = '/ceder';
}

function listarParaEvento(eventoId, eventoNombre) {
  // Redirige a cedente pre-seleccionando el evento
  window.location.href = `/ceder?evento=${encodeURIComponent(eventoNombre)}`;
}

/* ════════════════════════════════════════
   HELPERS
════════════════════════════════════════ */
function formatFecha(str) {
  if (!str) return '';
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ════════════════════════════════════════
   LEGAL
════════════════════════════════════════ */
function openLegal(type) {
  document.getElementById('legalTitle').textContent =
    type === 'terms' ? 'Términos y Condiciones' : 'Política de Privacidad';
  document.getElementById('legalContent').innerHTML = legalTexts[type];
  document.getElementById('legalModal').classList.add('open');
}
function closeLegal() {
  document.getElementById('legalModal').classList.remove('open');
}
