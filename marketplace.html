<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fandom — Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0a0a;
  --paper: #ffffff;
  --muted: #6b6b6b;
  --border: rgba(0,0,0,0.1);
  --card-bg: #ffffff;
  --red: #ef4444;
  --bg-hero: #ffffff;
  --brand-orange: #0a0a0a;
  --brand-green: #0a0a0a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--ink); color: var(--paper); }
html, body { min-height: 100dvh; background: var(--paper); color: var(--ink); font-family: 'Manrope', sans-serif; font-weight: 400; overflow-x: hidden; }
body::after {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.02;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 128px;
}

/* ═══════ AUTH MODAL ═══════ */
#authModal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  backdrop-filter: blur(10px); z-index: 500;
  display: none; align-items: flex-end; justify-content: center;
}
#authModal.open { display: flex; }
.auth-sheet {
  width: 100%; max-width: 480px;
  background: #ffffff; border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  max-height: 92dvh; overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
#authModal.open .auth-sheet { transform: translateY(0); }
.auth-handle { display: flex; justify-content: center; padding: 14px 0 0; }
.auth-handle-bar { width: 36px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.15); }
.auth-body { padding: 24px 28px 48px; }
.auth-view { display: none; }
.auth-view.active { display: block; }
.auth-title { font-family: 'Space Grotesk', sans-serif; font-size: 36px; color: var(--ink); letter-spacing: -0.02em; line-height: 1; margin-bottom: 6px; }
.auth-sub { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 24px; }

@media (min-width: 640px) {
  #authModal { align-items: center; }
  .auth-sheet {
    max-width: 420px; border-radius: 16px; border: 1px solid var(--border);
    transform: translateY(16px) scale(0.97); opacity: 0;
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.28s;
  }
  #authModal.open .auth-sheet { transform: translateY(0) scale(1); opacity: 1; }
  .auth-handle { display: none; }
}

/* ═══════ HEADER ═══════ */
header {
  position: sticky; top: 0; z-index: 100;
  background: #ffffff; border-bottom: 1px solid var(--border);
}
.header-inner {
  max-width: 1280px; margin: 0 auto;
  padding: 0 20px; height: 68px;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.btn-session {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--ink); color: var(--paper);
  border: 1px solid var(--ink); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.btn-session:hover { opacity: 0.85; }
.header-logo { height: 40px; display: block; }
.btn-ceder {
  display: flex; align-items: center; gap: 6px;
  background: var(--ink); color: var(--paper);
  font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 10px 16px; cursor: pointer; transition: all 0.2s;
  border: none;
}
.btn-ceder:hover { opacity: 0.85; }
@media (min-width: 640px) { .header-inner { padding: 0 32px; } .btn-ceder { font-size: 11px; padding: 10px 18px; } }
@media (min-width: 1024px) { .header-inner { padding: 0 48px; } }

/* ═══════ INTRO ═══════ */
.intro-strip { max-width: 1280px; margin: 0 auto; padding: 20px 20px 0; }
.intro-label {
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); display: flex; align-items: center; gap: 12px;
}
.intro-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
@media (min-width: 640px) { .intro-strip { padding: 28px 32px 0; } }
@media (min-width: 1024px) { .intro-strip { padding: 36px 48px 0; } }

/* ═══════ EVENTS GRID ═══════ */
main { max-width: 1280px; margin: 0 auto; }
.boletos-grid {
  padding: 16px 20px 80px;
  display: grid; grid-template-columns: 1fr; gap: 16px;
}
@media (min-width: 600px) { .boletos-grid { grid-template-columns: repeat(2, 1fr); padding: 20px 32px 80px; gap: 20px; } }
@media (min-width: 1024px) { .boletos-grid { grid-template-columns: repeat(3, 1fr); padding: 24px 48px 100px; gap: 24px; } }

/* ═══════ EVENT CARD ═══════ */
.evento-card {
  background: var(--card-bg); border: 1px solid var(--border);
  overflow: hidden; transition: border-color 0.25s, transform 0.25s;
  cursor: pointer; display: flex; flex-direction: column;
}
.evento-card:hover { border-color: rgba(0,0,0,0.3); transform: translateY(-2px); }
.evento-img-wrap { position: relative; width: 100%; height: 180px; overflow: hidden; flex-shrink: 0; background: #f5f5f5; }
.evento-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 0.3s; }
.evento-card:hover .evento-img { filter: brightness(0.95); }
.evento-precio-badge {
  position: absolute; bottom: 12px; right: 12px;
  font-family: 'Space Grotesk', sans-serif; font-size: 20px; letter-spacing: 0.04em; color: var(--paper);
  background: var(--ink); padding: 5px 12px;
}
.evento-body { padding: 18px 20px 20px; flex: 1; display: flex; flex-direction: column; }
.evento-nombre { font-family: 'Space Grotesk', sans-serif; font-size: 28px; letter-spacing: 0.04em; color: var(--ink); line-height: 1; margin-bottom: 6px; }
.evento-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.evento-tag { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.evento-fecha { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: var(--muted); }
.evento-fecha::before { content: '·'; margin-right: 10px; opacity: 0.4; }
.evento-desc { font-size: 12px; color: var(--muted); line-height: 1.65; margin-bottom: 16px; flex: 1; }
.btn-ver-boletos {
  width: 100%; padding: 14px; background: var(--ink); color: var(--paper);
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  border: none; cursor: pointer; font-weight: 500; transition: opacity 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-ver-boletos:hover { opacity: 0.85; }
.btn-ver-boletos:disabled { opacity: 0.4; cursor: not-allowed; }
.card-perf {
  display: flex; align-items: center; padding: 0 18px; position: relative; margin: 0 -1px;
  background: var(--ink);
}
.card-perf::before { content: ''; position: absolute; left: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 1px solid var(--border); z-index: 1; }
.card-perf::after { content: ''; position: absolute; right: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 1px solid var(--border); z-index: 1; }
.perf-line { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.2) 0, rgba(255,255,255,0.2) 5px, transparent 5px, transparent 10px); }
.perf-label { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--paper); opacity: 0.9; padding: 8px 10px; flex-shrink: 0; }

/* ═══════ PANEL ═══════ */
.panel-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px); z-index: 400;
  display: none; align-items: flex-end; justify-content: center;
}
.panel-bg.open { display: flex; }
.panel-sheet {
  width: 100%; max-width: 480px; background: #ffffff;
  border-top: 1px solid var(--border); border-radius: 20px 20px 0 0;
  max-height: 90dvh; display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
}
.panel-bg.open .panel-sheet { transform: translateY(0); }
@media (min-width: 640px) {
  .panel-bg { align-items: center; }
  .panel-sheet {
    max-width: 520px; border-radius: 16px; border: 1px solid var(--border);
    transform: translateY(20px) scale(0.97); opacity: 0;
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s;
  }
  .panel-bg.open .panel-sheet { transform: translateY(0) scale(1); opacity: 1; }
}
.panel-handle { display: flex; justify-content: center; padding: 14px 0 4px; flex-shrink: 0; }
.panel-handle-bar { width: 36px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.15); }
@media (min-width: 640px) { .panel-handle { display: none; } }
.panel-header {
  padding: 4px 20px 16px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: relative; display: flex; flex-direction: column;
}
.panel-evento-nombre { font-family: 'Space Grotesk', sans-serif; font-size: 28px; letter-spacing: 0.04em; color: var(--ink); line-height: 1; margin-bottom: 4px; transition: padding-left 0.3s; }
.panel-evento-meta { font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); transition: padding-left 0.3s; }
.panel-close { position: absolute; top: 0; right: 20px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 22px; line-height: 1; padding: 4px; transition: color 0.2s; }
.panel-close:hover { color: var(--ink); }
.panel-back { position: absolute; top: 0; left: 16px; background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; display: none; transition: color 0.2s; align-items: center; }
.panel-back:hover { color: var(--ink); }
.panel-header.has-back .panel-evento-nombre, .panel-header.has-back .panel-evento-meta { padding-left: 32px; }
.panel-header.has-back .panel-back { display: flex; }
.panel-body { flex: 1; overflow-y: auto; padding: 16px 20px 32px; }
.panel-body::-webkit-scrollbar { display: none; }

/* Panel inner elements */
.panel-section-label {
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 10px;
}
.panel-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.recinto-map { width: 100%; height: 160px; background: #f5f5f5; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; overflow: hidden; }
.recinto-map img { width: 100%; height: 100%; object-fit: contain; }
.boleto-item { background: #fafafa; border: 1px solid var(--border); padding: 16px 18px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: border-color 0.2s; cursor: pointer; }
.boleto-item:hover { border-color: rgba(0,0,0,0.35); }
.boleto-item-zona { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }
.boleto-item-detalle { font-size: 12px; color: var(--muted); line-height: 1.5; }
.boleto-item-precio { font-family: 'Space Grotesk', sans-serif; font-size: 22px; letter-spacing: 0.04em; color: var(--ink); text-align: right; flex-shrink: 0; }
.boleto-item-sub { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: right; }
.panel-empty { padding: 40px 0; text-align: center; }
.panel-empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.35; }
.panel-empty-title { font-family: 'Space Grotesk', sans-serif; font-size: 24px; color: var(--ink); letter-spacing: 0.04em; margin-bottom: 6px; }
.panel-empty-sub { font-size: 12px; color: var(--muted); line-height: 1.65; }
.panel-loading { display: flex; flex-direction: column; align-items: center; padding: 40px 0; gap: 14px; }
.spinner-sm { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--ink); animation: spin 0.8s linear infinite; }

/* Plan selector */
.plan-selector { display: flex; gap: 8px; margin-bottom: 20px; }
.plan-opcion { flex: 1; background: #fafafa; border: 1px solid var(--border); padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; }
.plan-opcion.activa { border-color: var(--ink); background: #f0f0f0; }
.plan-opcion-num { font-family: 'Space Grotesk', sans-serif; font-size: 30px; color: var(--ink); line-height: 1; }
.plan-opcion.activa .plan-opcion-num { color: var(--ink); }
.plan-opcion-label { font-family: 'Space Mono', monospace; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.plan-opcion-sub { font-family: 'Space Mono', monospace; font-size: 8px; color: var(--muted); margin-top: 2px; opacity: 0.6; }
.plan-desglose { background: #fafafa; border: 1px solid var(--border); padding: 16px; margin-bottom: 24px; }
.desglose-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.desglose-row:last-child { margin-bottom: 0; padding-top: 12px; border-top: 1px solid var(--border); color: var(--ink); }
.desglose-val { font-family: 'Space Mono', monospace; color: var(--ink); }
.desglose-row:last-child .desglose-val { color: var(--ink); font-weight: 600; }

/* Checkout */
.checkout-resumen { background: #fafafa; border: 1px solid var(--border); padding: 16px; margin-bottom: 20px; }
.wizard-progress { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; font-family: 'Space Mono', monospace; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; }
.wizard-step-ind { color: var(--muted); transition: color 0.3s; }
.wizard-step-ind.active { color: var(--ink); font-weight: 600; }
.wizard-step-ind.done { color: var(--ink); text-decoration: line-through; }
.ine-upload { border: 1px dashed var(--border); padding: 24px 16px; text-align: center; cursor: pointer; background: #fafafa; transition: border-color 0.2s; margin-bottom: 8px; }
.ine-upload:hover { border-color: var(--ink); }
.ine-icon { font-size: 24px; margin-bottom: 8px; opacity: 0.5; }
.ine-text { font-size: 12px; color: var(--muted); }
.ine-preview { max-width: 100%; max-height: 140px; object-fit: contain; display: none; margin: 0 auto; }
.solicitud-ok { text-align: center; padding: 32px 20px; }
.solicitud-ok-icon { width: 48px; height: 48px; background: var(--ink); color: var(--paper); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }

/* Form elements */
.form-group { margin-bottom: 16px; }
.form-label { display: block; font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.form-input { width: 100%; padding: 14px 16px; background: #fafafa; border: 1px solid var(--border); color: var(--ink); font-family: 'Manrope', sans-serif; font-size: 15px; outline: none; transition: border-color 0.2s; -webkit-appearance: none; border-radius: 0; }
.form-input:focus { border-color: var(--ink); }
.form-input::placeholder { color: var(--muted); }
.prefix-wrap { display: flex; }
.prefix-tag { padding: 14px 12px; background: #fafafa; border: 1px solid var(--border); border-right: none; font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.prefix-wrap .form-input { border-left: none; }
.input-row-acc { display: flex; margin-bottom: 12px; }
.prefix-acc { padding: 14px 12px; background: #fafafa; border: 1px solid var(--border); border-right: none; font-family: 'Space Mono', monospace; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.input-acc { flex: 1; padding: 14px; background: #fafafa; border: 1px solid var(--border); font-size: 16px; color: var(--ink); font-family: inherit; outline: none; transition: border-color 0.2s; -webkit-appearance: none; border-radius: 0; }
.input-acc:focus { border-color: var(--ink); }
.input-acc::placeholder { color: var(--muted); }
.btn-acc-primary { width: 100%; background: var(--ink); color: var(--paper); font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border: none; padding: 16px; cursor: pointer; font-weight: 500; transition: opacity 0.2s; border-radius: 0; }
.btn-acc-primary:hover { opacity: 0.85; }
.btn-acc-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.acc-error { display: none; margin-top: 10px; padding: 10px 14px; background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25); font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--red); text-align: center; width: 100%; }
.terms-wrap { display: flex; align-items: flex-start; gap: 12px; background: #fafafa; border: 1px solid var(--border); padding: 14px; margin-top: 4px; margin-bottom: 4px; }
.terms-wrap input[type=checkbox] { width: 16px; height: 16px; margin-top: 2px; flex-shrink: 0; accent-color: var(--ink); }
.terms-wrap label { font-size: 12px; color: var(--muted); line-height: 1.6; cursor: pointer; }

/* Legal modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 600; display: none; align-items: center; justify-content: center; padding: 24px; }
.modal-bg.open { display: flex; }
.modal-panel { background: #fff; border: 1px solid var(--border); width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; }
.modal-panel::-webkit-scrollbar { width: 3px; }
.modal-panel::-webkit-scrollbar-thumb { background: var(--border); }
.modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 1; }
.modal-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; color: var(--ink); letter-spacing: 0.04em; }
.modal-close { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px; transition: color 0.2s; }
.modal-close:hover { color: var(--ink); }
.modal-footer { padding: 14px 24px; border-top: 1px solid var(--border); position: sticky; bottom: 0; background: #fff; }
.legal-content { padding: 24px; font-size: 12px; color: var(--muted); line-height: 1.75; }
.legal-content h2 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; color: var(--ink); margin: 20px 0 10px; letter-spacing: 0.04em; }
.legal-content h3 { font-family: 'Space Mono', monospace; font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink); margin: 18px 0 6px; }
.legal-content p { margin-bottom: 10px; }
.legal-content ul { padding-left: 18px; margin-bottom: 10px; }
.legal-content ul li { margin-bottom: 5px; }
.legal-content strong { color: var(--ink); font-weight: 500; }

/* Animations */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.fade-up { animation: fadeUp 0.4s ease both; }
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}
</style>

<body>

<!-- ═══════ AUTH MODAL ═══════ -->
<div id="authModal" onclick="if(event.target===this)closeAuthModal()">
  <div class="auth-sheet" onclick="event.stopPropagation()">
    <div class="auth-handle"><div class="auth-handle-bar"></div></div>
    <div class="auth-body">

      <!-- Login -->
      <div id="authLoginView" class="auth-view active">
        <div class="auth-title">Iniciar sesión</div>
        <div class="auth-sub">Ingresa tu número para continuar.</div>
        <div class="input-row-acc">
          <span class="prefix-acc">+52</span>
          <input id="authCelularInput" class="input-acc" type="tel" placeholder="10 dígitos" maxlength="10" inputmode="numeric" pattern="[0-9]*">
        </div>
        <button class="btn-acc-primary" onclick="authIniciarSesion()">Entrar →</button>
        <div id="authLoginError" class="acc-error"></div>
        <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--muted);">
          ¿Sin cuenta? <span onclick="showAuthView('register')" style="color:var(--ink);cursor:pointer;text-decoration:underline;font-weight:500;">Regístrate aquí</span>
        </p>
      </div>

      <!-- Register -->
      <div id="authRegisterView" class="auth-view">
        <div class="auth-title">Crear cuenta</div>
        <div class="auth-sub">Solo lo esencial. Sin buró, sin complicaciones.</div>
        <div class="form-group">
          <label class="form-label">Nombre completo</label>
          <input type="text" id="auth_nombre" class="form-input" placeholder="Tu nombre completo" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label">Celular</label>
          <div class="prefix-wrap">
            <span class="prefix-tag">+52</span>

function openAuthModal(action) {
  pendingAction = action || 'general';

  document.getElementById('authCelularInput').value = '';
  document.getElementById('authLoginError').style.display = 'none';
  document.getElementById('authModal').classList.add('open');
}

function closeAuthModal() {
  document.getElementById('authModal').classList.remove('open');
}

function showAuthView(view) {
  document.querySelectorAll('.auth-view').forEach(v => v.classList.remove('active'));
  document.getElementById(view === 'login' ? 'authLoginView' : 'authRegisterView').classList.add('active');
}

function onAuthSuccess() {
  closeAuthModal();
  updateHeader();
  const action = pendingAction;
  pendingAction = null;

  if (action === 'checkout') {
    // Panel still open — continue to step 3
    resetWizard();
    renderStep3();
  } else if (action === 'ceder') {
    window.location.href = 'ceder-boleto.html';
  }
  // 'general' → just update header
}

async function authIniciarSesion() {
  const input = document.getElementById('authCelularInput').value.trim();
  const errEl = document.getElementById('authLoginError');
  if (input.length !== 10) {
    errEl.textContent = 'Ingresa 10 dígitos válidos.';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';
  const btn = document.querySelector('#authLoginView .btn-acc-primary');
  btn.disabled = true; btn.textContent = 'Verificando...';
  const numero = '+52' + input;
  try {
    const res = await fetch('/api/historial?celular=' + encodeURIComponent(numero));
    if (res.status === 404) {
      errEl.textContent = 'Número no registrado. Crea tu cuenta primero.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar →'; return;
    }
    localStorage.setItem('yunus_celular', numero);
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('yunus_historial', JSON.stringify(data.historial || []));
    }
    btn.disabled = false; btn.textContent = 'Entrar →';
    onAuthSuccess();
  } catch {
    // On network error still set session optimistically
    localStorage.setItem('yunus_celular', numero);
    btn.disabled = false; btn.textContent = 'Entrar →';
    onAuthSuccess();
  }
}

document.getElementById('authCelularInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') authIniciarSesion();
});

async function authSubmitRegistro() {
  const nombre = document.getElementById('auth_nombre').value.trim();
  const celRaw = document.getElementById('auth_celular').value.trim();
  const edad   = document.getElementById('auth_edad').value.trim();
  const terms  = document.getElementById('auth_terms').checked;
  const errEl  = document.getElementById('authRegError');

  if (!nombre || celRaw.length !== 10 || !edad || parseInt(edad) < 18) {
    errEl.textContent = 'Completa todos los campos. Debes ser mayor de 18 años.';
    errEl.style.display = 'block'; return;
  }
  if (!terms) {
    errEl.textContent = 'Debes aceptar los términos para continuar.';
    errEl.style.display = 'block'; return;
  }
  errEl.style.display = 'none';

  const btn = document.querySelector('#authRegisterView .btn-acc-primary');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-right:8px;vertical-align:middle;"></span>Creando cuenta...';

  const payload = {
    celular: '+52' + celRaw,
    Nombre_completo: nombre,
    Edad: edad,
    Entidad_federativa: '', Codigo_postal: '', Ingreso_mensual: '',
    Marca_celular: '', Gastos_celular: '', Gastos_vivienda: '',
    Gastos_automovil: '', Dependientes: '', Historial_crediticio: '', Otras_deudas: ''
  };

  try {
    const res = await fetch('/api/registrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.error || 'Error al crear la cuenta.';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Crear cuenta →'; return;
    }
    localStorage.setItem('yunus_celular', '+52' + celRaw);
    localStorage.setItem('yunus_historial', JSON.stringify([]));
    btn.disabled = false; btn.textContent = 'Crear cuenta →';
    onAuthSuccess();
  } catch {
    errEl.textContent = 'Error de conexión. Intenta de nuevo.';
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Crear cuenta →';
  }
}

  document.getElementById('boletosPanel').classList.remove('open');

  panelBoletoActual = null;
  panelPlanActual = null;

    document.getElementById('panelHeader').classList.remove('has-back');
    document.getElementById('panelNombre').textContent = panelEventoActual.name;
    document.getElementById('panelMeta').textContent = panelEventoActual.tag + ' · ' + panelEventoActual.fecha;
    renderPanelBody(panelEventoActual, boletosCache);

    renderStep2(panelBoletoActual);
  }
}

/* ════════════════════════════════════
   PASO 1: LISTA DE BOLETOS
════════════════════════════════════ */
async function abrirPanel(eventoId) {
  const ev = EVENTOS.find(e => e.id === eventoId);
  if (!ev) return;

  // Verificar KYC silenciosamente si hay sesión
  const celular = localStorage.getItem('yunus_celular');
  if (celular && !kycCompletado) {
    try {
      const r = await fetch(`/api/verificar-kyc?celular=${encodeURIComponent(celular)}`);
      const d = await r.json();
      if (d.kycCompletado) kycCompletado = true;
    } catch {}
  }

  panelPaso = 1;
  panelEventoActual = ev;
  // Default al primer plan disponible
  const opciones = [2, 3, 4].filter(q => q <= (ev.maxQuincenas || 4));
  panelPlanActual = opciones[0];

  document.getElementById('panelHeader').classList.remove('has-back');
  document.getElementById('panelNombre').textContent = ev.name;
  document.getElementById('panelMeta').textContent = ev.tag + ' · ' + ev.fecha;

  const panelBg = document.getElementById('boletosPanel');
  panelBg.classList.add('open');
  document.body.style.overflow = 'hidden';

  document.getElementById('panelBody').innerHTML = `
    <div class="panel-loading">
      <div class="spinner-sm"></div>
      <span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted);">Cargando boletos...</span>
    </div>`;

  try {
    const res = await fetch('/api/marketplace');
    const data = await res.json();
    const todos = data.boletos || [];
    const filtrados = todos.filter(b =>
      b.evento && b.evento.toLowerCase().includes(ev.apiKey.toLowerCase().split(' ')[0])
    );
    boletosCache = filtrados;
    renderPanelBody(ev, filtrados);
  } catch {
    renderPanelBody(ev, []);
  }
}

function renderPanelBody(ev, boletos) {
  let html = `
    <div class="panel-section-label" style="margin-top:4px;">Recinto</div>
    <div class="recinto-map">
      ${ev.mapaImg
        ? `<img src="${ev.mapaImg}" alt="Mapa ${ev.name}">`
        : `<div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
            <span style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);">Mapa próximamente</span>
          </div>`
      }
    </div>
    <div class="panel-section-label">
      Boletos disponibles
      <span style="font-family:'Space Mono',monospace;font-size:9px;padding:2px 8px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);">${boletos.length}</span>
    </div>`;

  if (boletos.length === 0) {
    html += `
      <div class="panel-empty">
        <div class="panel-empty-icon">🎟</div>
        <div class="panel-empty-title">Sin boletos aún</div>
        <p class="panel-empty-sub">No hay boletos listados para este evento todavía.<br>¿Tienes uno? Ponlo a trabajar.</p>
        <button onclick="handleCeder()" style="margin-top:16px;padding:12px 20px;background:transparent;color:var(--ink);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid var(--ink);cursor:pointer;">
          Listar mi boleto →
        </button>
      </div>`;
  } else {
    html += boletos.map(b => buildBoletoItem(b)).join('');
  }

  document.getElementById('panelBody').innerHTML = html;
}

function buildBoletoItem(b) {
  const precio = b.precioReventa
    ? '$' + Number(b.precioReventa).toLocaleString('es-MX', {maximumFractionDigits:0}) + ' MXN'
    : '—';
  return `
  <div class="boleto-item" onclick="seleccionarBoleto('${b.id || ''}')">
    <div class="boleto-item-info">
      <div class="boleto-item-zona">${b.zona || 'Zona general'}</div>
      <div class="boleto-item-detalle">${b.fechaEvento ? formatFecha(b.fechaEvento) : ''}${b.notas ? ' · ' + b.notas : ''}</div>
    </div>
    <div>
      <div class="boleto-item-precio">${precio}</div>
      <div class="boleto-item-sub">precio total</div>
    </div>
  </div>`;
}

function seleccionarBoleto(id) {
  const boleto = boletosCache.find(b => b.id === id);
  if (!boleto) return;
  panelBoletoActual = boleto;
  renderStep2(boleto);
}

/* ════════════════════════════════════
   PASO 2: CONFIGURAR PLAN
════════════════════════════════════ */
function renderStep2(boleto) {
  panelPaso = 2;
  const ev = panelEventoActual;
  const maxQ = ev.maxQuincenas || 4;
  const opciones = [2, 3, 4].filter(q => q <= maxQ);
  if (!opciones.includes(panelPlanActual)) panelPlanActual = opciones[0];

  const meses = { 2: '1 mes', 3: '~1.5 meses', 4: '2 meses' };

  document.getElementById('panelHeader').classList.add('has-back');
  document.getElementById('panelNombre').textContent = 'Elegir plan';
  document.getElementById('panelMeta').textContent = boleto.zona || 'Zona General';

  document.getElementById('panelBody').innerHTML = `
    <div class="panel-section-label" style="margin-top:4px;">Opciones de pago</div>
    <div class="plan-selector">
      ${opciones.map(q => `
        <div class="plan-opcion ${panelPlanActual === q ? 'activa' : ''}" id="po-${q}" onclick="seleccionarQuincenas(${q})">
          <div class="plan-opcion-num">${q}</div>
          <div class="plan-opcion-label">Quincenas</div>
          <div class="plan-opcion-sub">${meses[q] || ''}</div>
        </div>`).join('')}
    </div>
    <div class="panel-section-label">Desglose</div>
    <div id="planDesgloseContainer"></div>
    <button class="btn-ver-boletos" style="margin-top:16px;" onclick="confirmarPlan()">
      Continuar →
    </button>`;

  actualizarDesglose();
}

function seleccionarQuincenas(q) {
  panelPlanActual = q;
  const maxQ = panelEventoActual ? panelEventoActual.maxQuincenas || 4 : 4;
  [2, 3, 4].filter(x => x <= maxQ).forEach(x => {
    const el = document.getElementById('po-' + x);
    if (el) el.classList.toggle('activa', x === q);
  });
  actualizarDesglose();
}

function actualizarDesglose() {
  const precio = parseFloat(panelBoletoActual.precioReventa) || 0;
  const enganche = precio * 0.15;
  const cuota = (precio * 0.85) / panelPlanActual;
  const container = document.getElementById('planDesgloseContainer');
  if (!container) return;
  container.innerHTML = `
    <div class="plan-desglose">
      <div class="desglose-row"><span>Precio listado</span><span class="desglose-val">$${precio.toLocaleString('es-MX', {maximumFractionDigits:0})}</span></div>
      <div class="desglose-row"><span>Enganche (15%)</span><span class="desglose-val">$${enganche.toLocaleString('es-MX', {maximumFractionDigits:0})}</span></div>
      <div class="desglose-row"><span>${panelPlanActual} quincenas de</span><span class="desglose-val">$${cuota.toLocaleString('es-MX', {maximumFractionDigits:0})} c/u</span></div>
      <div class="desglose-row"><span>Total a pagar</span><span class="desglose-val">$${precio.toLocaleString('es-MX', {maximumFractionDigits:0})}</span></div>
    </div>`;
}

function confirmarPlan() {
  if (!hasSession()) {
    // Guardar estado — el panel sigue abierto detrás del modal
    pendingAction = 'checkout';
    openAuthModal('checkout');
    return;
  }
  resetWizard();
  renderStep3();
}

/* ════════════════════════════════════
   PASO 3: CHECKOUT
════════════════════════════════════ */
function resetWizard() {
  ineFrenteBase64 = null;
  ineReversoBase64 = null;
  selfieBase64 = null;
  uploadStep = 1;
}

function renderStep3() {
  panelPaso = 3;
  document.getElementById('panelNombre').textContent = 'Confirmar';
  document.getElementById('panelMeta').textContent = 'Último paso';

  const precio = parseFloat(panelBoletoActual.precioReventa) || 0;
  const enganche = precio * 0.15;
  const cuota = (precio * 0.85) / panelPlanActual;

  let html = `
    <div class="checkout-resumen">
      <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Resumen de tu orden</div>
      <div style="font-family:'Space Grotesk',sans-serif;font-size:24px;color:var(--ink);line-height:1;">${panelEventoActual.name}</div>
      <div style="font-size:12px;color:var(--muted);margin:4px 0 12px;">${panelBoletoActual.zona || 'Zona General'}</div>
      <div style="border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);">
          <span>Precio listado</span>
          <span style="font-family:'Space Mono',monospace;color:var(--ink);">$${precio.toLocaleString('es-MX', {maximumFractionDigits:0})}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);">
          <span>Enganche (15%)</span>
          <span style="font-family:'Space Mono',monospace;color:var(--ink);">$${enganche.toLocaleString('es-MX', {maximumFractionDigits:0})}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;border-top:1px solid var(--border);padding-top:10px;">
          <span style="color:var(--muted);">Plan elegido</span>
          <span style="font-family:'Space Mono',monospace;color:var(--ink);font-weight:600;">${panelPlanActual} × $${cuota.toLocaleString('es-MX', {maximumFractionDigits:0})}</span>
        </div>
      </div>
    </div>`;

  if (kycCompletado) {
    html += `
      <div style="margin-bottom:24px;padding:20px;text-align:center;background:#fafafa;border:1px solid var(--border);">
        <div style="font-size:28px;margin-bottom:8px;">✅</div>
        <div style="font-family:'Space Mono',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink);">Identidad verificada</div>
        <div style="font-size:12px;color:var(--muted);margin-top:6px;">Tus documentos ya están en el sistema de Fandom.</div>
      </div>
      <div id="chk_error" class="acc-error"></div>
      <button class="btn-ver-boletos" id="btnSubmitCheckout" onclick="submitSolicitud()">Enviar solicitud →</button>`;
  } else {
    html += `
      <div class="wizard-progress">
        <span id="prog1" class="wizard-step-ind active">1. FRENTE</span>
        <span id="prog2" class="wizard-step-ind">2. REVERSO</span>
        <span id="prog3" class="wizard-step-ind">3. SELFIE</span>
      </div>
      <div class="form-group">
        <label class="form-label" id="wizardLabel">Verificación (1/3): INE Frontal</label>
        <input type="file" id="chk_upload" accept="image/*" style="display:none;" onchange="handleWizardUpload(event)">
        <div class="ine-upload" id="chk_upload_trigger" onclick="document.getElementById('chk_upload').click()">
          <div id="chk_upload_content">
            <div class="ine-icon">🪪</div>
            <div class="ine-text">Toca para subir o tomar foto del frente de tu INE</div>
          </div>
          <img id="chk_upload_preview" class="ine-preview">
        </div>
      </div>
      <div id="chk_error" class="acc-error"></div>
      <button class="btn-ver-boletos" id="btnSubmitCheckout" style="display:none;" onclick="submitSolicitud()">Enviar solicitud →</button>`;
  }

  document.getElementById('panelBody').innerHTML = html;
}

/* ════════════════════════════════════
   WIZARD DE IMÁGENES
════════════════════════════════════ */
function comprimirImagen(file, maxWidth = 1000, calidad = 0.7) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const scale = Math.min(1, maxWidth / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function handleWizardUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('chk_upload_content').innerHTML = `<div class="spinner-sm" style="margin:0 auto;"></div>`;
  const base64 = await comprimirImagen(file);

  if (uploadStep === 1) {
    ineFrenteBase64 = base64;
    document.getElementById('prog1').classList.remove('active');
    document.getElementById('prog1').classList.add('done');
    document.getElementById('prog2').classList.add('active');
    uploadStep = 2;
    document.getElementById('wizardLabel').textContent = 'Verificación (2/3): INE Reverso';
    document.getElementById('chk_upload_content').innerHTML = `<div class="ine-icon">🪪</div><div class="ine-text">¡Listo! Ahora el reverso del INE</div>`;
  } else if (uploadStep === 2) {
    ineReversoBase64 = base64;
    document.getElementById('prog2').classList.remove('active');
    document.getElementById('prog2').classList.add('done');
    document.getElementById('prog3').classList.add('active');
    uploadStep = 3;
    document.getElementById('wizardLabel').textContent = 'Verificación (3/3): Selfie';
    document.getElementById('chk_upload').setAttribute('capture', 'user');
    document.getElementById('chk_upload_content').innerHTML = `<div class="ine-icon">🤳</div><div class="ine-text">¡Casi! Toca para tomarte una selfie</div>`;
  } else if (uploadStep === 3) {
    selfieBase64 = base64;
    document.getElementById('prog3').classList.remove('active');
    document.getElementById('prog3').classList.add('done');
    document.getElementById('chk_upload_content').style.display = 'none';
    const preview = document.getElementById('chk_upload_preview');
    preview.src = selfieBase64; preview.style.display = 'block';
    document.getElementById('wizardLabel').textContent = '¡Documentos completados!';
    document.getElementById('chk_upload_trigger').style.borderColor = 'var(--ink)';
    document.getElementById('chk_upload_trigger').onclick = null;
    document.getElementById('btnSubmitCheckout').style.display = 'block';
  }
  e.target.value = '';
}

async function submitSolicitud() {
  if (!kycCompletado && (!ineFrenteBase64 || !ineReversoBase64 || !selfieBase64)) {
    document.getElementById('chk_error').textContent = 'Completa las 3 fotos para continuar.';
    document.getElementById('chk_error').style.display = 'block'; return;
  }
  document.getElementById('chk_error').style.display = 'none';
  const btn = document.getElementById('btnSubmitCheckout');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm" style="display:inline-block;width:14px;height:14px;border-width:2px;border-top-color:#fff;margin-right:8px;vertical-align:middle;"></span>Procesando...';

  const payload = {
    celular: localStorage.getItem('yunus_celular'),
    evento: panelEventoActual.name,
    zona: panelBoletoActual.zona || 'General',
    ineFrente: ineFrenteBase64,
    ineReverso: ineReversoBase64,
    selfie: selfieBase64
  };

  try {
    const res = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error');

    document.getElementById('panelHeader').classList.remove('has-back');
    document.getElementById('panelNombre').textContent = 'Solicitud enviada';
    document.getElementById('panelMeta').textContent = 'En revisión';
    document.getElementById('panelBody').innerHTML = `
      <div class="solicitud-ok fade-up">
        <div class="solicitud-ok-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h3 style="font-family:'Space Grotesk',sans-serif;font-size:28px;color:var(--ink);margin-bottom:12px;letter-spacing:0.04em;">¡Todo en orden!</h3>
        <p style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:32px;">Recibimos tus documentos. Te contactaremos vía WhatsApp para confirmar tu enganche y asegurar tu lugar.</p>
        <button class="btn-ver-boletos" onclick="cerrarPanel()">Volver al marketplace</button>
        <button onclick="cerrarPanel()" style="margin-top:12px;width:100%;padding:14px;background:transparent;color:var(--ink);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;border:1px solid var(--ink);cursor:pointer;">
          + Agregar otro boleto
        </button>
      </div>`;
  } catch {
    document.getElementById('chk_error').textContent = 'Error de conexión. Intenta de nuevo.';
    document.getElementById('chk_error').style.display = 'block';
    btn.disabled = false; btn.innerHTML = 'Enviar solicitud →';
  }
}

}

   HELPERS
════════════════════════════════════ */
function formatFecha(str) {
  if (!str) return '';
  const d = new Date(str + 'T12:00:00');
  return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
}
